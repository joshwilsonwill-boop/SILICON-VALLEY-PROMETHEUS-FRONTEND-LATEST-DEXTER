<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flight — Above the ordinary</title>
  <style>
    @font-face{font-family:Flight;src:url('public/light.ttf');font-weight:300}
    @font-face{font-family:Flight;src:url('public/sans.ttf');font-weight:400}
    *{box-sizing:border-box}body{margin:0;background:#101113;color:#f4f4f0;font-family:Flight,system-ui,sans-serif;padding:38px 5vw 50px}
    header{display:flex;justify-content:space-between;align-items:center;margin:0 auto 32px;max-width:1500px}header span{font-size:12px;letter-spacing:3px;color:#b9bdc3}
    main{max-width:1500px;margin:auto}video{display:block;width:100%;aspect-ratio:16/9;background:#1d1f22;border-radius:16px;border:1px solid #ffffff16;box-shadow:0 30px 80px #0006}
    footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:28px}h1{font-size:30px;font-weight:300;letter-spacing:-.7px;margin:0 0 8px}p{font-size:14px;color:#8f959d;margin:0;line-height:1.5}
    .actions{display:flex;gap:10px}a,button{appearance:none;border:1px solid #ffffff28;border-radius:8px;padding:13px 18px;background:transparent;color:#eef0f3;text-decoration:none;font:14px Flight,sans-serif;cursor:pointer}a{background:#f4f4f0;color:#101113;border-color:#f4f4f0}button:hover{background:#ffffff0b}a:hover{background:white}
    @media(max-width:640px){body{padding:24px 20px}header{margin-bottom:22px}header span:last-child{font-size:9px;letter-spacing:1px}video{border-radius:9px}footer{align-items:flex-start;flex-direction:column}h1{font-size:26px}}
  </style>
</head>
<body>
  <header><span>FLIGHT / 001</span><span>A NEW PERSPECTIVE ↗</span></header>
  <main>
    <video id="film" src="flight.mp4" poster="01-reveal.png" controls playsinline preload="metadata" aria-label="Flight motion film with original sound design"></video>
    <footer>
      <div><h1>Above the ordinary.</h1><p>12 seconds · 1920 × 1080 · 60 fps · Original sound design</p></div>
      <div class="actions"><button id="replay">Replay ↗</button><a href="flight.mp4" download="flight.mp4">Download film</a></div>
    </footer>
  </main>
  <script>document.querySelector('#replay').addEventListener('click',()=>{const video=document.querySelector('#film');video.currentTime=0;video.play();});</script>
</body>
</html>
